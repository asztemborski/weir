name: "CI"

on:
  merge_group:
  pull_request:
  push:

jobs:
  cargo-build:
    name: Cargo build
    runs-on: ubuntu-latest

    steps:
      - name: Fetch repository
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Cargo build
        uses: cargo b --workspace --all-targets --all-features

  cargo-fmt:
    name: Cargo fmt
    runs-on: ubuntu-latest

    steps:
      - name: Fetch repository
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt

      - name: Rusfmt check
        run: cargo fmt --all --check

  cargo-clippy:
    name: Cargo clippy
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Repository
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy

      - name: Clippy check
        run: cargo clippy --workspace --all-targets --all-features -- -W clippy::pedantic
