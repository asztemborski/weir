[package]
name = "weirctrl"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
rcgen = { workspace = true }
anyhow = { workspace = true }

axum = { version = "0.8.9", features = ["http2", "macros"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
hyper = { version = "1.11.0"  }
hyper-util = "0.1.20"
rustls = "0.23.42"
rustls-pki-types = "1.15.1"
time = "0.3.54"
tokio-rustls = "0.26.4"
tower-service = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa-axum = "0.2.0"
utoipa = "5.5.0"
utoipa-scalar = "0.3.0"
tokio-util = { version = "0.7.19", features = ["rt"] }
